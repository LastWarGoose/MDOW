[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "mdow"
version = "0.1.0"
description = "Локальный редактор MP3 и ID3 для Windows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "PySide6-Essentials==6.12.0",
  "PySide6-Addons==6.12.0",
  "yt-dlp[default]==2026.10.26",
  "mutagen==1.48.1",
  "Pillow==13.0.0",
]

[project.gui-scripts]
mdow = "app.__main__:main"

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-qt==4.5.0", "ruff==0.17.5", "pyinstaller==6.22.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
